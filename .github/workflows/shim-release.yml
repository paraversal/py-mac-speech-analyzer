name: "Forwarding shim to PyPI"

on:
  push:
    tags: ["shim-v*"]

defaults:
  run:
    working-directory: shim

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish
